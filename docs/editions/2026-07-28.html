@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  margin: 0;
  padding: 20px 16px 40px;
  background: #e8e8e8;
  font-family: 'Playfair Display', serif;
  color: #111;
  -webkit-font-smoothing: antialiased;
}

/* ── PAPER ── */
.paper {
  max-width: 1200px;
  margin: 0 auto;
  background: #ffffff;
  background-image:
    radial-gradient(ellipse at top left, #ebebeb 0%, transparent 60%),
    radial-gradient(ellipse at bottom right, #e8e8e8 0%, transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 22px, rgba(0,0,0,.025) 22px, rgba(0,0,0,.025) 23px);
}

/* ── MASTHEAD ── */
.masthead {
  text-align: center;
  padding: 14px 24px 10px;
  border-top: 6px double #111;
}
.masthead-name {
  font-family: 'UnifrakturMaguntia', cursive;
  font-size: clamp(2.8rem, 9vw, 6.5rem);
  line-height: 1;
  letter-spacing: 2px;
  color: #111;
}
.masthead-tagline {
  font-size: .56rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #444;
  margin-top: 2px;
}
.masthead-rule { border: none; border-top: 1px solid #111; margin: 6px 0 0; }

/* ── SECTION NAV ── */
.section-nav {
  display: flex;
  border-top: 3px solid #111;
  border-bottom: 3px solid #111;
  overflow-x: auto;
  scrollbar-width: none;
}
.section-nav::-webkit-scrollbar { display: none; }
.nav-btn {
  flex: 1;
  min-width: 80px;
  padding: 7px 12px;
  font-family: 'Playfair Display', serif;
  font-size: .6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  background: none;
  border: none;
  border-right: 1px solid #bbb;
  cursor: pointer;
  color: #444;
  white-space: nowrap;
  transition: all .12s;
}
.nav-btn:last-child { border-right: none; }
.nav-btn:hover { background: #e0e0e0; color: #111; }
.nav-btn.active { background: #111; color: #fff; }

/* ── DATELINE ── */
.dateline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 24px;
  border-bottom: 2px solid #111;
  font-size: .55rem;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #444;
}
.dateline-center { font-weight: 700; color: #111; font-size: .58rem; }

/* ── PAGE BODY ── */
.page { padding: 16px 24px 40px; }

/* ── SECTION FLAGS ── */
.flag {
  font-family: 'Playfair Display', serif;
  font-size: .55rem;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #f2f2f2;
  background: #111;
  display: inline-block;
  padding: 2px 8px;
  margin-bottom: 4px;
}
.section-divider {
  border: none;
  border-top: 3px solid #111;
  margin: 18px 0 12px;
}
.section-divider-thin {
  border: none;
  border-top: 1px solid #999;
  margin: 14px 0 10px;
}
.section-label {
  font-family: 'Playfair Display', serif;
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  border-top: 3px solid #111;
  border-bottom: 1px solid #111;
  padding: 3px 0;
  margin: 18px 0 10px;
}

/* ── KICKER / HEADLINE ── */
.kicker {
  display: block;
  font-size: .5rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: #111;
  font-weight: 700;
  margin-bottom: 2px;
  border-bottom: 1px solid #111;
  padding-bottom: 2px;
  display: inline-block;
}
h1.headline {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.9rem, 4vw, 3.2rem);
  font-weight: 900;
  line-height: 1.02;
  letter-spacing: -.5px;
  margin-bottom: 5px;
}
h2.headline {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.1rem, 2.5vw, 1.5rem);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -.3px;
  margin-bottom: 4px;
}
h3.headline {
  font-family: 'Playfair Display', serif;
  font-size: clamp(.9rem, 1.8vw, 1.1rem);
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 3px;
}
.deck {
  font-family: 'Playfair Display', serif;
  font-size: .88rem;
  font-style: italic;
  color: #333;
  line-height: 1.4;
  margin-bottom: 4px;
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
}
.byline {
  font-size: .54rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #555;
  margin-bottom: 8px;
}

/* ── STORY BODY ── */
.story-body {
  font-size: .79rem;
  line-height: 1.75;
  text-align: justify;
  hyphens: auto;
}
.story-body p + p { text-indent: 1.3em; }
.story-2col { column-count: 2; column-gap: 18px; column-rule: 1px solid #ccc; }
.story-3col { column-count: 3; column-gap: 16px; column-rule: 1px solid #ccc; }

/* ── FRONT PAGE GRID ── */
.front-grid {
  display: grid;
  grid-template-columns: 1fr 190px;
  gap: 0;
  padding-bottom: 16px;
  border-bottom: 2px solid #111;
  margin-bottom: 14px;
}
.front-main { border-right: 1.5px solid #111; padding-right: 18px; }
.front-sidebar { padding-left: 10px; }

/* ── SCORE SIDEBAR ── */
.scores-head {
  font-family: 'Playfair Display', serif;
  font-size: .68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-top: 2px solid #111;
  border-bottom: 2px solid #111;
  padding: 2px 0;
  margin-bottom: 6px;
}
.scores-sport-lbl {
  font-size: .48rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #555;
  margin: 7px 0 2px;
  border-bottom: 1px solid #bbb;
  padding-bottom: 1px;
}
.score-game { padding: 2px 0; border-bottom: 1px solid #ddd; }
.score-row { display: flex; justify-content: space-between; font-size: .65rem; line-height: 1.55; }
.score-team { flex: 1; }
.score-val { font-weight: 700; min-width: 18px; text-align: right; font-family: 'Playfair Display', serif; }
.score-status { font-size: .48rem; color: #666; font-style: italic; text-align: right; }

/* ── SECONDARY STORIES (3-col) ── */
.sec-stories-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0 0;
  margin-bottom: 14px;
}
.sec-story { border-right: 1px solid #bbb; padding: 0 14px; }
.sec-story:first-child { padding-left: 0; }
.sec-story:last-child { border-right: none; padding-right: 0; }

/* ── OPINION ── */
.opinion-wrap {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 0 14px;
  border-top: 3px double #111;
  padding-top: 12px;
  margin-top: 16px;
}
.opinion-label {
  border-right: 1.5px solid #111;
  padding-right: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.opinion-tag {
  font-size: .48rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #111;
}
.opinion-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-style: italic;
  line-height: 1.1;
}

/* ── SPORT SECTION LAYOUT ── */
.sport-main-grid {
  display: grid;
  grid-template-columns: 1fr 220px;
  gap: 0;
  padding-bottom: 14px;
  border-bottom: 2px solid #111;
  margin-bottom: 14px;
}
.sport-left { border-right: 1.5px solid #111; padding-right: 18px; }
.sport-right { padding-left: 8px; }

/* ── SCHEDULE ── */
.schedule-head {
  font-family: 'Playfair Display', serif;
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-top: 2px solid #111;
  border-bottom: 2px solid #111;
  padding: 2px 0;
  margin-bottom: 6px;
}
.schedule-item {
  padding: 5px 0;
  border-bottom: 1px dotted #bbb;
}
.sched-time { font-size: .52rem; text-transform: uppercase; letter-spacing: .8px; color: #666; margin-bottom: 1px; }
.sched-matchup { font-family: 'Playfair Display', serif; font-size: .85rem; font-weight: 700; line-height: 1.2; margin-bottom: 1px; }
.sched-pitchers { font-size: .64rem; font-style: italic; color: #444; }
.sched-note { font-size: .52rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-top: 1px; }

/* ── BOX SCORES ── */
.bs-section-head {
  font-size: .6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  border-top: 3px solid #111;
  border-bottom: 2px solid #111;
  padding: 3px 0;
  margin: 16px 0 10px;
}
.bs-game { margin-bottom: 20px; }
.bs-game-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 900;
  margin-bottom: 5px;
  border-bottom: 1px solid #111;
  padding-bottom: 3px;
}
/* Linescore */
.linescore-wrap { overflow-x: auto; margin-bottom: 6px; }
table.linescore {
  width: 100%;
  border-collapse: collapse;
  font-size: .62rem;
  font-family: 'Playfair Display', serif;
}
.linescore th {
  padding: 2px 5px;
  text-align: center;
  font-weight: 700;
  font-size: .55rem;
  text-transform: uppercase;
  border-bottom: 2px solid #111;
  border-top: 1px solid #111;
  background: #111;
  color: #f2f2f2;
  white-space: nowrap;
}
.linescore th:first-child { text-align: left; min-width: 100px; }
.linescore td { padding: 2px 5px; text-align: center; border-bottom: 1px solid #ddd; }
.linescore td:first-child { text-align: left; font-weight: 700; }
.linescore .tot { font-weight: 700; background: #e0e0e0; }
/* Batting box */
table.btbl {
  width: 100%;
  border-collapse: collapse;
  font-size: .62rem;
  font-family: 'Playfair Display', serif;
  margin-bottom: 4px;
}
.btbl th {
  text-align: right;
  font-weight: 700;
  font-size: .52rem;
  text-transform: uppercase;
  border-top: 1px solid #111;
  border-bottom: 1px solid #111;
  padding: 2px 4px;
  background: #e0e0e0;
}
.btbl th:first-child { text-align: left; }
.btbl td { padding: 1px 4px; border-bottom: 1px solid #e0e0e0; text-align: right; }
.btbl td:first-child { text-align: left; }
.btbl .team-hdr td { font-weight: 700; font-size: .58rem; text-transform: uppercase; letter-spacing: 1px; background: #ddd; text-align: left !important; padding: 3px 4px; }
.btbl .totals-row td { font-weight: 700; border-top: 1px solid #111; border-bottom: 2px solid #111; background: #eee; }
/* NFL stat tables */
.nfl-stat-lbl { font-size: .54rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid #999; margin: 8px 0 3px; padding-bottom: 2px; }
table.nfltbl {
  width: 100%;
  border-collapse: collapse;
  font-size: .61rem;
  margin-bottom: 4px;
}
.nfltbl th { text-align: right; font-weight: 700; font-size: .52rem; text-transform: uppercase; border-bottom: 1px solid #999; padding: 1px 4px; background: #e0e0e0; }
.nfltbl th:first-child, .nfltbl th:nth-child(2) { text-align: left; }
.nfltbl td { padding: 1px 4px; border-bottom: 1px solid #e0e0e0; text-align: right; }
.nfltbl td:first-child, .nfltbl td:nth-child(2) { text-align: left; }
.bs-notes {
  font-size: .6rem;
  font-style: italic;
  color: #444;
  line-height: 1.55;
  border-top: 1px solid #ccc;
  padding-top: 4px;
  margin-top: 4px;
}

/* ── STANDINGS ── */
.standings-wrap { overflow-x: auto; }
table.std-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: .62rem;
  font-family: 'Playfair Display', serif;
  margin-bottom: 4px;
}
.std-tbl th {
  text-align: right;
  font-weight: 700;
  font-size: .52rem;
  text-transform: uppercase;
  letter-spacing: .3px;
  border-top: 1px solid #111;
  border-bottom: 2px solid #111;
  padding: 2px 4px;
  white-space: nowrap;
  background: #e0e0e0;
}
.std-tbl th:first-child { text-align: left; min-width: 130px; }
.std-tbl td { padding: 2px 4px; border-bottom: 1px solid #ddd; text-align: right; white-space: nowrap; }
.std-tbl td:first-child { text-align: left; }
.std-tbl tr:first-child td { font-weight: 700; }
.std-div-lbl {
  font-size: .54rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin: 12px 0 3px;
  padding-bottom: 2px;
  border-bottom: 1px solid #aaa;
}

/* ── LEAGUE LEADERS ── */
.leaders-split { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.leaders-col-head {
  font-family: 'Playfair Display', serif;
  font-size: .78rem;
  font-weight: 900;
  text-transform: uppercase;
  text-align: center;
  border-top: 2px solid #111;
  border-bottom: 2px solid #111;
  padding: 3px 0;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.leader-block { margin-bottom: 10px; }
.leader-cat {
  font-size: .54rem;
  font-weight: 700;
  font-style: normal;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  border-bottom: 1px solid #999;
  padding-bottom: 2px;
  margin-bottom: 2px;
}
table.ldr-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: .61rem;
  font-family: 'Playfair Display', serif;
}
.ldr-tbl th { text-align: left; font-weight: 700; font-size: .5rem; text-transform: uppercase; border-bottom: 1px solid #ccc; padding: 1px 3px; }
.ldr-tbl th:not(:first-child) { text-align: right; }
.ldr-tbl td { padding: 1px 3px; border-bottom: 1px solid #eee; }
.ldr-tbl td:not(:first-child) { text-align: right; }

/* ── BRACKET ── */
.bracket-wrap { display: flex; overflow-x: auto; padding: 4px 0 8px; gap: 0; }
.brk-round { flex: none; min-width: 150px; padding: 0 8px; border-right: 1px solid #bbb; }
.brk-round:last-child { border-right: none; }
.brk-round-lbl { font-size: .5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; text-align: center; border-bottom: 1px solid #bbb; padding-bottom: 3px; margin-bottom: 5px; }
.brk-series { border: 1px solid #bbb; margin: 3px 0; background: #fff; }
.brk-team { padding: 3px 6px; display: flex; justify-content: space-between; font-size: .6rem; border-bottom: 1px solid #eee; }
.brk-team:last-of-type { border-bottom: none; }
.brk-team.won { font-weight: 700; background: #e0e0e0; }
.brk-status { font-size: .49rem; color: #555; font-style: italic; text-align: center; padding: 2px; border-top: 1px solid #eee; background: #f5f5f5; }

/* ── FOOTER ── */
.footer {
  border-top: 3px double #111;
  padding: 7px 24px;
  display: flex;
  justify-content: space-between;
  font-size: .54rem;
  color: #555;
  text-transform: uppercase;
  letter-spacing: .5px;
  background: #f5f5f5;
}

/* ── RESPONSIVE ── */
@media (max-width: 760px) {
  .page { padding: 10px 14px 28px; }
  .dateline { padding: 3px 14px; flex-direction: column; gap: 2px; text-align: center; }
  .front-grid, .sport-main-grid { grid-template-columns: 1fr; }
  .front-main, .sport-left { border-right: none; padding-right: 0; border-bottom: 2px solid #111; padding-bottom: 14px; margin-bottom: 12px; }
  .front-sidebar, .sport-right { padding-left: 0; }
  .story-2col, .story-3col { column-count: 1; }
  .sec-stories-grid { grid-template-columns: 1fr; }
  .sec-story { border-right: none; padding: 0; border-bottom: 1px solid #bbb; padding-bottom: 12px; margin-bottom: 12px; }
  .sec-story:last-child { border-bottom: none; }
  .opinion-wrap { grid-template-columns: 1fr; }
  .opinion-label { border-right: none; flex-direction: row; align-items: center; gap: 8px; border-bottom: 1px solid #111; padding-bottom: 5px; margin-bottom: 8px; }
  .leaders-split { grid-template-columns: 1fr; }
  .footer { padding: 7px 14px; flex-direction: column; gap: 2px; text-align: center; }
}

@media (max-width: 600px) {
  .sp-nav-btn { flex: none; padding: 8px 10px; font-size: .54rem; letter-spacing: .8px; }
}
@media (max-width: 480px) {
  .masthead-name { font-size: 1.6rem; }
  .sp-name { font-size: 2.2rem; }
  .nav-btn { font-size: .5rem; padding: 7px 6px; }
  .sp-nav-btn {
    font-size: .52rem;
    letter-spacing: .5px;
    padding: 8px 8px;
    border-right: 1px solid #bbb;
  }
}

 the Eastern Conference.", "byline": "By Marcus Webb", "body": "PHILADELPHIA — LeBron James is a 76er. The franchise made it official Monday, confirming a two-year deal worth $8 million total on the veteran minimum, a stunning union that sends the 40-year-old icon to Philadelphia in what could be the final chapter of the greatest career in NBA history. The 76ers celebrated the signing with a full coronation rollout across their social media channels, draping the Wells Fargo Center in imagery of James in a Philadelphia uniform before a single practice had been scheduled.\n\nThe seismic move immediately reshuffled the landscape of what was already a turbulent free-agency market. With James now committed to Philadelphia, agents and front offices across the league scrambled to reassess their plans. Shams Charania reported Monday that DeMar DeRozan, Klay Thompson and Jonathan Kuminga have emerged as the premier names to watch in the market left behind by James' departure from the Los Angeles Lakers, with multiple contenders eyeing that trio to fill the offensive void at the wing position.\n\nThe ripple effects reached beyond the hardwood. Charles Barkley's renewed push to crown LeBron the unquestioned GOAT drew immediate pushback from Brian Windhorst, who questioned the logic of elevating James further based on a veteran-minimum signing late in his career. Meanwhile, Michael Jordan — the man at the center of the GOAT debate — was photographed Monday in Ibiza embracing David Beckham at a seaside lunch, appearing entirely unbothered by the conversation happening thousands of miles away in American sports media."}, "schedule": [], "boxScores": [], "standings": [], "leaders": {"left": {"label": "Eastern Conference", "cats": [{"cat": "Scoring (PPG)", "cols": ["Player", "Team", "G", "Pts", "PPG"], "rows": [["Jalen Brunson", "NYK", "19", "539.6", "28.4"], ["Cade Cunningham", "DET", "14", "393.4", "28.1"], ["Paolo Banchero", "ORL", "7", "184.1", "26.3"], ["Donovan Mitchell", "CL     ],
    nhl:[
      {away:"Boston",as:3,home:"Florida",hs:4,note:"2OT — FLA leads 3-2"},
      {away:"Edmonton",as:3,home:"Vancouver",hs:2,note:"OT — EDM wins 4-1"},
      {away:"Carolina",as:5,home:"New Jersey",hs:1,note:"CAR wins 4-2"},
      {away:"NY Rangers",as:2,home:"Washington",hs:4,note:"Series tied 3-3"},

};

// ── SECTIONS ──────────────────────────────────────────────────────────────────
const SECTIONS = [
  {id:"front",label:"Front Page"},
  {id:"mlb",  label:"Baseball"},
  {id:"nba",  label:"Basketball"},
  {id:"nhl",  label:"Hockey"},
  {id:"nfl",  label:"Football"},
];
const META = {date:"Thursday, May 14, 2026", edition:"Vol. CXLVIII · No. 134", weather:"Fair, 76°F"};

// ── FRONT PAGE ─────────────────────────────────────────────────────────────────

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function paras(text) {
  if (!text) return '';
  return text.split(/\n\n+/).filter(Boolean).map(p => `<p>${p.trim()}</p>`).join('');
}
function secHead(label) {
  return `<div class="sp-sec-head"><span class="sp-sec-head-red">◆</span>${label}</div>`;
}
function kicker(t) { return t ? `<span class="sp-kicker">${t}</span>` : ''; }
function story(s, hLevel, bodyClass, collapsible) {
  if (!s) return '';
  const bodyHtml = paras(s.body||''||s.story?.body||'');
  const uid = collapsible ? 'lead-' + (Math.random().toString(36).slice(2,7)) : '';
  const bodyEl = collapsible
    ? `<div id="lb-${uid}" class="sp-body ${bodyClass||''} sp-lead-body-collapsed">${bodyHtml}</div>
       <button class="sp-lead-expand" onclick="expandLead('${uid}')">Continue Reading &#8594;</button>`
    : `<div class="sp-body ${bodyClass||''}">${bodyHtml}</div>`;
  return `${kicker(s.kicker)}
    <h${hLevel} class="sp-hl-head" style="margin-top:4px">${s.headline||''}</h${hLevel}>
    ${s.deck   ? `<p class="sp-hl-deck">${s.deck}</p>`    : ''}
    ${s.byline ? `<p class="sp-byline">${s.byline}</p>` : ''}
    ${bodyEl}`;
}

function expandLead(uid) {
  const body = document.getElementById('lb-'+uid);
  if (body) {
    body.classList.remove('sp-lead-body-collapsed');
    body.nextElementSibling && body.nextElementSibling.classList.contains('sp-lead-expand')
      ? body.nextElementSibling.style.display = 'none' : null;
  }
}

// ── SCORES ───────────────────────────────────────────────────────────────────
function scoreGame(g) {
  return `<div style="padding:2px 0;border-bottom:1px solid #ddd;font-size:.65rem;font-family:'Libre Baskerville', serif">
    <div style="display:flex;justify-content:space-between;line-height:1.55"><span style="flex:1">${g.away||g.away_team||''}</span><span style="font-weight:700;min-width:18px;text-align:right">${g.away_score||g.as||0}</span></div>
    <div style="display:flex;justify-content:space-between;line-height:1.55"><span style="flex:1">${g.home||g.home_team||''}</span><span style="font-weight:700;min-width:18px;text-align:right">${g.home_score||g.hs||0}</span></div>
    <div style="font-size:.48rem;color:#666;font-style:italic;text-align:right">${g.status||g.note||'Final'}</div>
  </div>`;
}

function switchTab(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sp-nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const btn = document.querySelector('.sp-nav-btn[data-id="'+id+'"]');
  if (btn) btn.classList.add('active');
  try { localStorage.setItem('sp-tab',id); localStorage.setItem('sp-tab-date',new Date().toISOString().slice(0,10)); } catch(e) {}
  window.scrollTo(0,0);
}

function renderSidebar(scores) {
  let html = `<div class="sp-score-col-head">Yesterday's Scores</div>`;
  const sports = ['nba','mlb','nhl'];
  const sectionLabels = {nba:'Basketball',mlb:'Baseball',nhl:'Hockey'};
  sports.forEach(key => {
    const games = (scores[key]||[]).filter(g=>(g.away||g.away_team)&&(g.home||g.home_team));
    if (!games.length) return;
    const lbl = {nba:'NBA',mlb:'Baseball',nhl:'Hockey'}[key];
    html += `<div style="font-size:.48rem;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;color:#8B0000;margin:7px 0 2px;border-bottom:1px solid #bbb;padding-bottom:1px">${lbl}</div>`;
    games.forEach(g => { html += scoreGame(g); });
    html += '<div style="font-size:.72rem;font-style:italic;text-align:right;padding:4px 0 6px;margin-bottom:2px"><a href="#" onclick="switchTab(\''+key+'\'); return false;" style="color:#8B0000;text-decoration:none;">See ' + sectionLabels[key] + ' Section for More &#8594;</a></div>';
  });
  return html;
}


// ── SCHEDULE ────────────────────────────────────────────────────────────────
function renderSchedule(games, label) {
  if (!games || !games.length) return '';
  const GS = 'padding:6px 8px;border-bottom:1px dotted #ccc;border-right:1px dotted #ccc';
  let html = `<div class="schedule-head">${label||"Today's Games"}</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));border-top:1px solid #ccc">`;
  games.forEach(g => {
    html += `<div style="${GS}">
      <div class="sched-time">${g.time||''}</div>
      <div class="sched-matchup">${g.away||''} at ${g.home||''}</div>
      ${(g.asp||g.hsp)?`<div class="sched-pitchers">${g.asp||''} vs. ${g.hsp||''}</div>`:''}
      ${g.note?`<div class="sched-note">${g.note}</div>`:''}
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderLinescore(ls, sport) {
  const isBB = sport==='mlb', isHK = sport==='nhl';
  const scores = ls.away.scores;
  const cols = isBB ? scores.map((_,i)=>i+1)
    : isHK ? ['1','2','3','OT','SO'].slice(0,scores.length)
    : ['Q1','Q2','Q3','Q4','OT'].slice(0,scores.length);

  const TH = 'background:#111;color:#fff;font-size:.5rem;font-weight:700;text-transform:uppercase;text-align:center;padding:2px 4px;white-space:nowrap;min-width:18px';
  const THL = 'background:#111;color:#fff;font-size:.5rem;font-weight:700;text-transform:uppercase;text-align:left;padding:2px 6px;min-width:120px';
  const TD = 'text-align:center;font-size:.62rem;padding:2px 4px;border-bottom:1px solid #e0e0e0;font-family:"Libre Baskerville",serif;white-space:nowrap';
  const TDL = 'text-align:left;font-size:.62rem;font-weight:700;padding:2px 6px;border-bottom:1px solid #e0e0e0;font-family:"Libre Baskerville",serif;white-space:nowrap';
  const TDTOT = 'text-align:center;font-size:.62rem;font-weight:700;padding:2px 4px;border-bottom:1px solid #e0e0e0;background:#e0e0e0;font-family:"Libre Baskerville",serif;white-space:nowrap';
  const SEP = 'text-align:center;font-size:.6rem;color:#999;padding:0 3px;border-bottom:1px solid #e0e0e0';

  const rows = [ls.away, ls.home].map(side => {
    const scoreCells = (side.scores||[]).map(s=>`<td style="${TD}">${s}</td>`).join('');
    const totals = isBB
      ? `<td style="${SEP}">—</td><td style="${TDTOT}">${side.r}</td><td style="${TDTOT}">${side.h}</td><td style="${TDTOT}">${side.e}</td>`
      : `<td style="${SEP}">—</td><td style="${TDTOT}">${side.r}</td>`;
    return `<tr><td style="${TDL}">${side.name}</td>${scoreCells}${totals}</tr>`;
  });

  const rhe = isBB
    ? `<th style="${TH}">R</th><th style="${TH}">H</th><th style="${TH}">E</th>`
    : `<th style="${TH}">T</th>`;

  return `<div style="overflow-x:auto;margin-bottom:6px"><table style="border-collapse:collapse;width:100%">
    <thead><tr>
      <th style="${THL}">Team</th>
      ${cols.map(c=>`<th style="${TH}">${c}</th>`).join('')}
      <th style="padding:0 3px;background:#111"></th>
      ${rhe}
    </tr></thead>
    <tbody>${rows.join('')}</tbody>
  </table></div>`;
}


function renderBatting(batting, sport) {
  if (!batting || !batting.some(t=>t.players&&t.players.length)) return '';
  const isBB=sport==='mlb', isHK=sport==='nhl';
  const cols = isBB?['AB','R','H','BI','BB','SO','Avg']:isHK?['G','A','Pts','+/-','PIM','SOG']:['Min','FG','3P','FT','Reb','Ast','Pts'];
  let html = '<div style="overflow-x:auto"><table class="btbl">';
  batting.forEach(tm => {
    html += `<thead>
      <tr class="team-hdr"><td colspan="${cols.length+1}">${tm.team}</td></tr>
      <tr><th>Player</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>
    </thead><tbody>`;
    tm.players.forEach(p => {
      const vals = isBB?[p.ab,p.r,p.h,p.bi,p.bb,p.so,p.avg]:isHK?[p.g,p.a,p.pts,p.pm,p.pim,p.sog]:[p.min,p.fg,p.tp,p.ft,p.reb,p.ast,p.pts];
      html += `<tr><td>${p.name}</td>${vals.map(v=>`<td>${v}</td>`).join('')}</tr>`;
    });
    if (tm.totals) {
      const tvals = isBB?[tm.totals.ab,tm.totals.r,tm.totals.h,tm.totals.bi,tm.totals.bb,tm.totals.so,'']:isHK?['','','','',tm.totals.pim,tm.totals.sog]:Object.values(tm.totals);
      html += `<tr class="totals-row"><td>Totals</td>${tvals.map(v=>`<td>${v}</td>`).join('')}</tr>`;
    }
    html += '</tbody>';
  });
  html += '</table></div>';
  return html;
}

function renderBoxScores(boxScores, sport, label) {
  if (!boxScores || !boxScores.length) return '';
  let html = `${secHead(label||'Yesterday\'s Box Scores')}
    <p style="font-size:.62rem;font-style:italic;color:#666;margin-bottom:8px">Click any game to expand full box score.</p>`;
  boxScores.forEach((game, idx) => {
    const id = `bs-${sport}-${idx}`;
    const hasBatting = game.batting && game.batting.some(t=>t.players&&t.players.length);
    const hasNFL = sport==='nfl' && game.nflStats;
    const canExpand = hasBatting || hasNFL;
    html += `<div class="bs-game">
      <div class="bs-game-title" style="font-size:.85rem" ${canExpand?`onclick="toggleBS('${id}')" style="cursor:pointer"`:''}>
        ${game.title}
        ${canExpand?`<span id="${id}-toggle" style="font-size:.64rem;color:#8B0000;font-weight:400;float:right">▼ Full Box Score</span>`:''}
      </div>
      ${renderLinescore(game.linescore, sport)}
      <div id="${id}" style="display:none">
        ${hasBatting ? renderBatting(game.batting, sport) : ''}
        ${hasNFL ? renderNFLStats(game.nflStats) : ''}
      </div>
      ${game.notes ? `<p class="bs-notes">${game.notes}</p>` : ''}
    </div>`;
  });
  return html;
}

function renderPitching(pitching) {
  if (!pitching || !pitching.some(t=>t.pitchers&&t.pitchers.length)) return '';
  const TH = 'text-align:right;font-weight:700;border-bottom:1px solid #111;border-top:1px solid #111;padding:1px 3px;font-size:.49rem;text-transform:uppercase;background:#e0e0e0';
  const TD = 'padding:0 3px;border-bottom:1px solid #ebebeb;text-align:right;font-size:.58rem;font-family:"Libre Baskerville",serif';
  let html = '<table style="border-collapse:collapse;width:100%;margin-top:4px">';
  pitching.forEach(tm => {
    if (!tm.pitchers||!tm.pitchers.length) return;
    html += `<thead>
      <tr><td colspan="9" style="font-weight:700;font-size:.58rem;text-transform:uppercase;letter-spacing:1px;background:#ddd;padding:2px 3px;text-align:left">${tm.team}</td></tr>
      <tr><th style="${TH};text-align:left">Pitcher</th><th style="${TH}">IP</th><th style="${TH}">H</th><th style="${TH}">R</th><th style="${TH}">ER</th><th style="${TH}">BB</th><th style="${TH}">SO</th><th style="${TH}">NP</th><th style="${TH}">ERA</th></tr>
    </thead><tbody>`;
    tm.pitchers.forEach(p => {
      html += `<tr>
        <td style="${TD};text-align:left">${p.name||''}</td>
        <td style="${TD}">${p.ip||''}</td><td style="${TD}">${p.h||0}</td>
        <td style="${TD}">${p.r||0}</td><td style="${TD}">${p.er||0}</td>
        <td style="${TD}">${p.bb||0}</td><td style="${TD}">${p.so||0}</td>
        <td style="${TD}">${p.np||0}</td><td style="${TD}">${p.era||'—'}</td>
      </tr>`;
    });
    html += '</tbody>';
  });
  html += '</table>';
  return html;
}

function toggleBS(id) {
  const el = document.getElementById(id);
  const tog = document.getElementById(id+'-toggle');
  if (el.style.display==='none') { el.style.display='block'; tog.textContent='▲ Collapse'; }
  else { el.style.display='none'; tog.textContent='▼ Full Box Score'; }
}

function renderNFLStats(nflStats) {
  if (!nflStats) return '';
  return nflStats.map(sec => `
    <div class="nfl-stat-lbl">${sec.label}</div>
    <table class="nfltbl"><thead><tr>${sec.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${sec.rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>
  `).join('');
}

// ── STANDINGS ────────────────────────────────────────────────────────────────
function renderStandings(divisions, hasSplit) {
  if (!divisions||!divisions.length||!Array.isArray(divisions)) return '';
  const TH = 'text-align:right;font-weight:700;font-size:.52rem;text-transform:uppercase;border-top:1px solid #111;border-bottom:2px solid #111;padding:2px 4px;background:#e0e0e0;white-space:nowrap';
  const TD = 'padding:2px 4px;border-bottom:1px solid #e0e0e0;text-align:right;white-space:nowrap;font-size:.61rem;font-family:"Libre Baskerville",serif';

  function renderDiv(div) {
    if (!div || !div.teams || !div.teams.length) return '';
    const hasNote = div.teams[0] && div.teams[0].note;
    return `<div style="margin-bottom:14px;break-inside:avoid">
      <div style="font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;padding-bottom:2px;border-bottom:1px solid #aaa;color:#8B0000">${div.label||''}</div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
        <table style="min-width:${hasSplit?'420px':'240px'};width:100%;border-collapse:collapse;table-layout:auto">
          <thead><tr>
            <th style="${TH};text-align:left;min-width:140px;width:35%">Team</th>
            <th style="${TH}">W</th><th style="${TH}">L</th><th style="${TH}">Pct</th><th style="${TH}">GB</th>
            ${hasSplit?`<th style="${TH}" class="std-hide-mobile">L10</th><th style="${TH}" class="std-hide-mobile">Str</th><th style="${TH}" class="std-hide-mobile">Home</th><th style="${TH}" class="std-hide-mobile">Away</th>`:''}
            ${hasNote?`<th style="${TH};text-align:left">Note</th>`:''}
          </tr></thead>
          <tbody>
            ${div.teams.map((t,i)=>`<tr>
              <td style="${TD};text-align:left;font-weight:${i===0?'700':'400'};min-width:130px">${t.name||''}</td>
              <td style="${TD};font-weight:${i===0?'700':'400'}">${t.w||''}</td>
              <td style="${TD};font-weight:${i===0?'700':'400'}">${t.l||''}</td>
              <td style="${TD};font-weight:${i===0?'700':'400'}">${t.pct||''}</td>
              <td style="${TD};font-weight:${i===0?'700':'400'}">${t.gb||''}</td>
              ${hasSplit?`<td style="${TD}" class="std-hide-mobile">${t.l10||''}</td><td style="${TD}" class="std-hide-mobile">${t.strk||''}</td><td style="${TD}" class="std-hide-mobile">${t.home||''}</td><td style="${TD}" class="std-hide-mobile">${t.away||''}</td>`:''}
              ${t.note?`<td style="${TD};text-align:left;font-size:.52rem;color:#555;font-style:italic">${t.note}</td>`:''}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  // For MLB (6 divisions): split AL (first 3) and NL (last 3) into explicit columns
  if (divisions.length === 6) {
    const left  = divisions.slice(0,3);
    const right = divisions.slice(3,6);
    return `<div class="standings-two-col">
      <div>${left.map(renderDiv).join('')}</div>
      <div>${right.map(renderDiv).join('')}</div>
    </div>`;
  }

  // For other sports (2 divisions): same two-column split
  if (divisions.length === 2) {
    return `<div class="standings-two-col">
      <div>${renderDiv(divisions[0])}</div>
      <div>${renderDiv(divisions[1])}</div>
    </div>`;
  }

  // Default: single column
  return `<div>${divisions.map(renderDiv).join('')}</div>`;
}


function renderLeaders(leaders) {
  if (!leaders) return '';
  const { left, right } = leaders;
  if (!left || !right) return '';
  function buildCol(side) {
    if (!side || !side.cats) return '';
    let html = '<div>';
    html += '<div style="font-family:Playfair Display,serif;font-size:.78rem;font-weight:900;text-transform:uppercase;text-align:center;border-top:2px solid #111;border-bottom:2px solid #111;padding:3px 0;margin-bottom:8px;letter-spacing:1px">' + (side.label||'') + '</div>';
    (side.cats||[]).forEach(cat => {
      const cols = cat.cols||[];
      const rows = (cat.rows||[]).slice(0,8);
      const n = cols.length;
      const restPct = n > 1 ? Math.floor(55/(n-1)) : 55;
      html += '<div style="margin-bottom:12px">';
      html += '<div style="font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid #999;padding-bottom:2px;margin-bottom:3px">' + (cat.cat||'') + '</div>';
      html += '<table style="width:100%;border-collapse:collapse;table-layout:fixed">';
      // Header
      html += '<thead><tr>';
      cols.forEach((c,i) => {
        const w = i===0 ? '45%' : restPct+'%';
        const align = i===0 ? 'left' : 'right';
        html += '<th style="font-weight:700;font-size:.5rem;text-transform:uppercase;border-top:2px solid #111;border-bottom:1px solid #111;padding:3px 4px;background:#e8e8e8;white-space:nowrap;width:'+w+';text-align:'+align+'">' + c + '</th>';
      });
      html += '</tr></thead>';
      // Rows
      html += '<tbody>';
      rows.forEach(row => {
        html += '<tr>';
        (row||[]).forEach((cell,k) => {
          const align = k===0 ? 'left' : 'right';
          html += '<td style="padding:2px 4px;border-bottom:1px solid #eee;font-size:.6rem;font-family:Libre Baskerville,serif;white-space:nowrap;text-align:'+align+'">' + cell + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    });
    html += '</div>';
    return html;
  }
  return '<div class="leaders-split">' + buildCol(left) + buildCol(right) + '</div>';
}

function renderEditorsNote() {
  return `<div class="editors-note">
    <span class="editors-note-tag">From the Editor</span>
    <p class="editors-note-head">This site is built by a lifelong sports fan who misses the ritual of reading the morning sports section.</p>
    <div class="editors-note-body">
      <p>No autoplay videos. No clickbait. No gambling spam.</p>
      <p>Just scores, stories, standings, and the joy of sports.</p>
      <p>If you'd like to help keep the presses running:</p>
    </div>
    <a class="editors-note-link" href="https://buymeacoffee.com/andrewdobrow" target="_blank" rel="noopener">Support The Sports Page</a>
  </div>`;
}

function buildFront(overrides) {
  // Use overrides from data.json if available, else use static front data
  const hl  = (overrides && overrides.headline)  || front.headline;
  const sec = (overrides && overrides.secondary) || front.secondary;
  const col = (overrides && overrides.column)    || front.column;
  const sc  = (overrides && overrides.scores)    || front.scores;

  document.getElementById('front').innerHTML = `
    <div class="sp-front-wrapper">
    <div class="sp-front-grid" style="align-items:start">
      <div style="padding-right:18px">
        ${story(hl, 1, 'sp-hl-body', true)}
      </div>
      <div class="sp-score-sidebar">
        ${renderSidebar(sc)}
      </div>
    </div>
    ${renderEditorsNote()}
    <hr class="sp-rule-thin"/>
    </div>
    <div class="sp-sec-grid">
      ${sec.map(s=>`<div class="sp-sec-story">
        ${kicker(s.kicker)}
        <h3 class="sp-sec-head" style="margin-top:4px">${s.headline||''}</h3>
        ${s.deck?`<p class="sp-sec-s-deck">${s.deck}</p>`:''}
        ${s.byline?`<p class="sp-sec-s-byline">${s.byline}</p>`:''}
        <div class="sp-sec-s-body">${paras(s.body||'')}  </div>
      </div>`).join('')}
    </div>
    <div class="sp-opinion">
      <div class="sp-opinion-label">
        <span class="sp-op-tag">${col.tag||'Press Box'}</span>
        <span class="sp-op-title">Opinion</span>
      </div>
      <div>
        <h2 class="sp-op-head">${col.headline||''}</h2>
        ${col.byline?`<p class="sp-op-byline">${col.byline}</p>`:''}
        <div class="sp-op-body">${paras(col.body||'')}  </div>
      </div>
    </div>`;
}

function buildSport(id, overrides) {
  const d = {mlb,nba,nhl,nfl}[id];
  const storyData   = (overrides && overrides.story)     || d.story;
  const schedData   = (overrides && overrides.schedule)  || d.schedule;
  const scoresData  = (overrides && overrides.scores)    || d.scores;
  const stdsData    = (overrides && overrides.standings) || d.standings;
  const boxData     = (overrides && overrides.boxScores) || d.boxScores || [];
  const leadersData = (overrides && overrides.leaders)   || d.leaders;
  const hasSplit   = id==='mlb'||id==='nhl';
  const isNFL      = id==='nfl';
  const stdsCount  = (stdsData||[]).length;

  document.getElementById(id).innerHTML = `
    <div style="padding-bottom:14px;border-bottom:2px solid #111;margin-bottom:14px">
      ${story(storyData, 1, 'sp-hl-body', true)}
    </div>
    <div class="sp-editors-note-desktop">${renderEditorsNote()}</div>
    ${(schedData&&schedData.filter(g=>g.away&&g.home).length) ? `<div style="margin-bottom:14px">
      ${renderSchedule(schedData.filter(g=>g.away&&g.home), isNFL?'Offseason Calendar':'Today\'s Schedule')}
    </div>` : ''}
    <div class="sp-editors-note-mobile">${renderEditorsNote()}</div>

    ${boxData.length ? secHead(isNFL?'Postseason Results':'Yesterday\'s Box Scores') : ''}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 20px;align-items:start">
    ${boxData.map((game,idx)=>{
      const bid = `bs-${id}-${idx}`;
      const hasBatting = game.batting&&game.batting.some(t=>t.players&&t.players.length);
      const hasNFL2 = id==='nfl'&&game.nflStats;
      const canExpand = hasBatting||hasNFL2;
      return `<div class="bs-game">
        <div class="bs-game-title" style="font-size:.85rem" >
          <span>${game.title}</span>
          
        </div>
        ${renderLinescore(game.linescore,id)}
        <div id="${bid}" style="display:block">
          ${hasBatting?renderBatting(game.batting,id):''}
          ${id==='mlb'&&game.pitching&&game.pitching.some(t=>t.pitchers&&t.pitchers.length)?renderPitching(game.pitching):''}
          ${hasNFL2?renderNFLStats(game.nflStats):''}
        </div>
        ${game.notes?(()=>{
  // Handle both double-space and ". " separators
  const raw = game.notes;
  // Split on double-space, or ". " followed by an uppercase word and colon
  let parts = raw.split('  ').filter(Boolean);
  if (parts.length <= 1) {
    // Try splitting on period-space before a stat label
    parts = raw.split(/\.\s+(?=[A-Z]{1,4}:)/).filter(Boolean);
  }
  if (parts.length <= 1) parts = [raw];
  const formatted = parts.map(part => {
    part = part.replace(/\.\s*$/, '').trim();
    const colon = part.indexOf(':');
    if (colon === -1) return part;
    const lbl = part.slice(0, colon).trim();
    const val = part.slice(colon + 1).trim();
    return '<b>' + lbl + ':</b> ' + val;
  }).filter(Boolean).join(' &nbsp;&nbsp; ');
  return '<p class="bs-notes">' + formatted + '</p>';
})():''}
      </div>`;
    }).join('')}
    </div>
    ${(stdsData&&stdsData.length) ? secHead(isNFL?'Final Standings':id==='nba'?'Playoff Standings':'Standings') : ''}
    ${renderStandings(stdsData||[],hasSplit)}
    ${leadersData ? secHead('League Leaders')+renderLeaders(leadersData) : ''}`;
}

function renderScores(games, label) {
  if (!games||!games.length) return '';
  let html = `<div class="sp-col-head">${label}</div>`;
  games.forEach(g => { html += scoreGame(g); });
  return html;
}

// ═══════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════
function buildNav() {
  const nav = document.getElementById('main-nav');
  SECTIONS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'sp-nav-btn' + (s.id==='front'?' active':'');
    btn.setAttribute('data-id', s.id);
    btn.textContent = s.label;
    
    
    btn.onclick = () => {
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.sp-nav-btn').forEach(b=>{b.classList.remove('active');b.style.background='';b.style.color='';});
      document.getElementById(s.id).classList.add('active');
      btn.classList.add('active');
      try { const td = new Date().toISOString().slice(0,10); localStorage.setItem('sp-tab', s.id); localStorage.setItem('sp-tab-date', td); } catch(e) {}
    };
    nav.appendChild(btn);
  });
  // Archive link (static — links to separate page)
  const arc = document.createElement('a');
  arc.href = '../archive.html';
  arc.className = 'sp-nav-btn';
  arc.textContent = 'Archive';
  nav.appendChild(arc);
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function init() {
  // Always build with static data first
  buildNav();
  document.getElementById('dl-edition').textContent = META.edition;
  document.getElementById('dl-date').textContent    = META.date;
  
  buildFront(null);
  SECTIONS.filter(s=>s.id!=='front').forEach(s => buildSport(s.id, null));

  // Show the paper immediately
  document.getElementById('loading').style.display = 'none';
  document.getElementById('paper').style.display   = 'block';

  // Restore last active tab — only if saved today
  try {
    const saved     = localStorage.getItem('sp-tab');
    const savedDate = localStorage.getItem('sp-tab-date');
    const today     = new Date().toISOString().slice(0,10);
    if (saved && savedDate === today && document.getElementById(saved)) {
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.sp-nav-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById(saved).classList.add('active');
      document.querySelector(`.sp-nav-btn[data-id="${saved}"]`)?.classList.add('active');
    }
  } catch(e) {}

  // Load edition data (baked in) or fall back to data.json
  try {
    let d = window.__EDITION_DATA__;
    if (!d) {
      const res = await fetch('../data.json?t=' + Date.now());
      if (!res.ok) throw new Error('data.json not found');
      const text = await res.text();
      if (!text || text.trim()[0] !== '{') throw new Error('not JSON');
      d = JSON.parse(text);
    }
    // Update dateline if available
    if (d.date)    document.getElementById('dl-date').textContent    = d.date;
    if (d.edition) document.getElementById('dl-edition').textContent = d.edition;
    // Update stories and scores from pipeline
    if (d.front)   buildFront(d.front);
    if (d.mlb)     buildSport('mlb', d.mlb);
    if (d.nba)     buildSport('nba', d.nba);
    if (d.nhl)     buildSport('nhl', d.nhl);
    if (d.nfl)     buildSport('nfl', d.nfl);
  } catch(e) {
    // No data.json — static data already showing, no problem
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
